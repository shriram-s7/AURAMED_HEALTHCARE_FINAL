version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auramed}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres:5432/auramed}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-min-32-chars-auramed-secret}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BREAST_MODEL_PATH: ${BREAST_MODEL_PATH:-app/ml/weights/breast_model.pth}
      CERVICAL_MODEL_PATH: ${CERVICAL_MODEL_PATH:-app/ml/weights/cervical_model.pth}
      PCOS_MODEL_PATH: ${PCOS_MODEL_PATH:-app/ml/weights/pcos_model.pth}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@auramed.in}
      FROM_NAME: ${FROM_NAME:-AuraMed}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      PATIENT_PORTAL_URL: ${PATIENT_PORTAL_URL:-http://localhost:5173/patient}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
